# Every property can be overridden by environment variables (Spring relaxed binding),
# eg. ibkr.tws.host -> IBKR_TWS_HOST, ibkr.allow-live -> IBKR_ALLOW_LIVE, server.port -> SERVER_PORT

spring.application.name=ibkrfacade
server.port=8082
server.servlet.context-path=/ibkr
spring.task.scheduling.pool.size=10
springdoc.packagesToScan=hu.auxin.ibkrfacade

# --- TWS / IB Gateway
ibkr.tws.host=localhost
# 4002: IB Gateway paper, 4001: IB Gateway live, 7497: TWS paper, 7496: TWS live
ibkr.tws.port=4002
# must be unique among the API clients connected to the same gateway
ibkr.tws.client-id=1
ibkr.tws.reconnect-interval=10s
ibkr.tws.request-timeout=15s

# 1 = live, 2 = frozen, 3 = delayed, 4 = delayed frozen market data
ibkr.market-data-type=1
ibkr.tick-by-tick-stream=false

# --- Safety
# Orders are rejected on a live account unless this is true
ibkr.allow-live=false
# The sample strategies (TrendTradingStrategy, SampleSaver) are not loaded unless this is true
ibkr.strategies.enabled=false

# --- Orders
# An order is placed only if there is a bid or ask not older than this (0 disables the age check)
ibkr.order.max-quote-age=15m
# How long to wait for the first quote when the instrument has no market data subscription yet
ibkr.order.quote-wait=3s
# How long POST /order and DELETE /orders/{id} wait for the first answer of TWS
ibkr.order.ack-timeout=3s
# How long a client_order_id is kept in Redis
ibkr.order.idempotency-ttl=30d

# --- Redis (with RedisTimeSeries, eg. Redis 8)
# expire time series data after 1 hour (milliseconds)
redis.default-retention=3600000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60s

# --- API token authentication (Authorization: Bearer <token>)
ibkr.security.enabled=false
# read-only endpoints (GET, POST /price)
ibkr.security.read-token=
# every endpoint, including POST /order and DELETE /orders/{id}
ibkr.security.write-token=
# /v3/api-docs and /swagger-ui without token
ibkr.security.public-docs=true

# --- Observability
# JSON logs: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash, gelf); the Docker image does it by default
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,tws,redis
